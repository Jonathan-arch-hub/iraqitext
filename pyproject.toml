[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iraqitext"
version = "0.3.0"
description = "Lightweight NLP for the Iraqi Arabic dialect: normalization, tokenization, dialect detection and Iraqi <-> MSA translation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

authors = [
    { name = "JOHN" }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Natural Language :: Arabic",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
# Restrict discovery to the library itself. Without this, any stray directory
# under src/ (an accidental virtualenv, a stray checkout, ...) is picked up as
# a top-level package and ends up in the exported metadata.
include = ["iraqitext*"]

[tool.setuptools.package-data]
# The three data files are the library, not decoration: without them the
# engine starts up with an empty dictionary.  Keep this list in step with
# `validate.py`, which refuses to run if one of them is missing.
iraqitext = ["dictionary.json", "morphology.json", "lexicon.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]